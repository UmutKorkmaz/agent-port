[pytest]
testpaths = tests
addopts =
    --cov=main
    --cov-report=term-missing
    # TODO: coverage is currently ~50%. Raise --cov-fail-under toward 80 as the
    # security-critical and contract paths gain tests. Keep it low for now so CI
    # stays green but the floor is tracked and ratchets upward.
    --cov-fail-under=45
