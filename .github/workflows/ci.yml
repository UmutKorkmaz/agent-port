name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each job is independent so a failure in one stack does not mask the others.
jobs:
  dotnet:
    name: .NET (platform-api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build platform-api
        run: dotnet build src/platform-api/AgentPort.PlatformApi.csproj --configuration Release

      - name: Test
        run: dotnet test tests/PlatformApi.Tests/PlatformApi.Tests.csproj --configuration Release

      # Testcontainers spins up pgvector/pgvector:pg16 via the Docker daemon, which is available on
      # GitHub-hosted ubuntu runners, to assert the auth floor against a real Postgres.
      - name: Integration tests (Testcontainers Postgres)
        run: dotnet test tests/PlatformApi.IntegrationTests/PlatformApi.IntegrationTests.csproj --configuration Release

  python:
    name: Python (ai-services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test with coverage
        run: pytest

  web:
    name: Web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # docker-compose.prod.yml uses ${VAR:?...} fail-fast secrets. Synthesize a
      # throwaway .env.prod for CI with random values (these never leave the
      # runner and are discarded when the job ends).
      - name: Synthesize CI secrets
        run: |
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=ci"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "RABBITMQ_USER=ci"
            echo "RABBITMQ_PASS=$(openssl rand -hex 16)"
            echo "MINIO_ROOT_USER=ci"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MINIO_BUCKET=ci"
            echo "AI_SERVICES_INTERNAL_TOKEN=$(openssl rand -hex 32)"
            echo "DEFTERPORT_SITE_ADDRESS=https://localhost"
            echo "OLLAMA_ENABLED=false"
          } > .env.prod

      # Bring up the full stack on the deterministic hash embedding backend and
      # publish the web service to host port 3002 (see docker-compose.ci-e2e.yml).
      - name: Start stack (hash embedding backend)
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-e2e.yml \
            --env-file .env.prod \
            up -d --build

      - name: Wait for web to be reachable
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3002/ >/dev/null 2>&1; then
              echo "web is up"
              exit 0
            fi
            sleep 5
          done
          echo "web did not become reachable in time"
          docker compose -f docker-compose.prod.yml -f docker-compose.ci-e2e.yml --env-file .env.prod logs --tail=200
          exit 1

      - name: Install web dependencies
        working-directory: src/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        working-directory: src/web
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3002
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web/playwright-report
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-e2e.yml \
            --env-file .env.prod \
            down -v
