# AgentPort / AgentPort — single-node on-prem PRODUCTION stack.
#
# Security posture (see docs/install-runbook.md for the full rationale):
#   * Only Caddy publishes a host port (443). Every other service is reachable
#     ONLY on the internal compose network — no `ports:` mappings at all.
#   * NO default-credential fallbacks. Every secret is required from .env.prod.
#     The `${VAR:?...}` form makes `docker compose` FAIL FAST if a secret is unset,
#     instead of silently falling back to a well-known dev password.
#   * Sovereign defaults: AGENTPORT_SOVEREIGN=true locks egress, dev endpoints stay
#     off, content is redacted from traces, live provider calls are disabled, and
#     Ollama is the only provider the runtime may reach.
#   * Pins and healthchecks mirror the dev docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This file is ADDITIVE. It does not replace the dev docker-compose.yml.

name: agentport-prod

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.prod.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.prod.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.prod.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    # requirepass is mandatory in prod; AOF persistence retained from dev.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.prod.example)}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required (see .env.prod.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required (see .env.prod.example)}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.prod.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.prod.example)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.prod.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.prod.example)}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required (see .env.prod.example)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: src/platform-api/Dockerfile
    image: agentport/platform-api:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5001
      # Connection strings are composed from the same required secrets.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      AI_SERVICES_URL: "http://ai-services:5002"
      # Internal service token: platform-api forwards it to ai-services on every call.
      AI_SERVICES_INTERNAL_TOKEN: ${AI_SERVICES_INTERNAL_TOKEN:?AI_SERVICES_INTERNAL_TOKEN is required (see .env.prod.example)}
      # Sovereign / KVKK defaults.
      AGENTPORT_SOVEREIGN: "true"
      TRACE_REDACT_CONTENT: "true"
      PROVIDER_LIVE_CALLS: "false"
      # AGENTPORT_ALLOW_DEV_ENDPOINTS intentionally UNSET (dev endpoints stay 404 in prod).
    healthcheck:
      # curl is installed in the platform-api runtime image for exactly this probe.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m

  ai-services:
    build:
      context: .
      dockerfile: src/ai-services/Dockerfile
    image: agentport/ai-services:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      # ai-services REQUIRES this token (rejects /v1/* without it) — same value as platform-api.
      AI_SERVICES_INTERNAL_TOKEN: ${AI_SERVICES_INTERNAL_TOKEN:?AI_SERVICES_INTERNAL_TOKEN is required (see .env.prod.example)}
      # Sovereign / KVKK defaults.
      AGENTPORT_SOVEREIGN: "true"
      TRACE_REDACT_CONTENT: "true"
      PROVIDER_LIVE_CALLS: "false"
      # Ollama is the ONLY enabled provider. It is off by default here; point
      # OLLAMA_BASE_URL at a host/LAN Ollama and flip OLLAMA_ENABLED=true to use it.
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBEDDING_BACKEND: "e5"
    volumes:
      # Persist the multilingual-e5-base download across restarts.
      - hf_cache:/home/appuser/.cache/huggingface
    extra_hosts:
      # Lets the container reach an Ollama running on the Docker host (Linux + Desktop).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5002/health/live', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
        reservations:
          memory: 1g

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    image: agentport/web:prod
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_started
      ai-services:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Next.js rewrite targets resolve to compose service names inside the network.
      PLATFORM_API_ORIGIN: "http://platform-api:5001"
      AI_SERVICES_ORIGIN: "http://ai-services:5002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    # The ONLY service that publishes a host port. Binds 443 (and 80 for ACME/redirect).
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      AGENTPORT_SITE_ADDRESS: ${AGENTPORT_SITE_ADDRESS:-https://localhost}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
        reservations:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  hf_cache:
  caddy_data:
  caddy_config:
